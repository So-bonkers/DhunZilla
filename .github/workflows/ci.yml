# Linux-only CI matrix (ADR-0006): x86_64 + aarch64. macOS/Windows are deferred, not
# abandoned; the C++ stays portable so a port is a CI/build job later, not a rewrite.
# Config authored pre-push — first run validates the runner labels.
name: ci
on:
  # wp-*/ship-* branches get CI *before* they reach main; ship.sh only fast-forwards main to a
  # commit whose branch run is green (and main's branch protection requires these checks).
  push: { branches: [main, "wp-*", "ship-*"] }
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04        # linux-x64
            name: linux-x64
          - os: ubuntu-24.04-arm    # linux-arm64 (native ARM runner)
            name: linux-arm64
    name: core ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Build (determinism flags enforced by CMakeLists; ADR-0004)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Unit tests
        run: ./build/op_tests
        shell: bash
      # The cross-arch determinism test IS this step: the same committed golden WAV must
      # match renders from every architecture. If libm drifts across platforms this fails loudly.
      - name: Golden renders (bit-exact vs committed fixtures)
        run: bash harness/run_goldens.sh
      - name: CLI exit-code contracts
        run: bash harness/test_cli_errors.sh
      # The three glue scripts (stem/midi/prompt → editable project) have never been exercised in
      # CI; a shared bug in job_client.py would ship unnoticed (WP-0134). Mock backends only —
      # uv is here just to launch `opsidecar serve`; no ML extras, no GPU, no network.
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - name: Glue scripts e2e (mock backends)
        run: |
          cd ai-sidecar && uv sync
          cd .. && bash harness/test_glue_scripts.sh
      - name: Negative control — corrupt fixture must FAIL the harness
        run: |
          tmp=$(mktemp -d); mkdir -p "$tmp/goldens"
          cp tests/fixtures/goldens/demo.opj "$tmp/goldens/"
          # golden with one byte flipped in payload
          python3 - <<'PY'
          data = bytearray(open("tests/fixtures/goldens/demo.wav","rb").read())
          data[1000] ^= 0xFF
          open("/tmp/corrupt_demo.wav","wb").write(bytes(data))
          PY
          cp /tmp/corrupt_demo.wav "$tmp/goldens/demo.wav"
          if python3 harness/golden_diff.py tests/fixtures/goldens/demo.wav "$tmp/goldens/demo.wav"; then
            echo "NEGATIVE CONTROL FAILED: harness accepted a corrupted golden"; exit 1
          fi
          echo "negative control OK (harness rejected corrupt golden)"

  # WP-0139: commits claimed "ASAN-clean" with no job able to reproduce it. This is that job.
  # ubuntu-24.04 (x86_64) only, per package spec. Goldens were verified bit-exact under
  # Debug+sanitizers on the aarch64 reference rig (WP-0139 handoff), so all three suites run here;
  # if that ever drifts, move run_goldens.sh back to the Release jobs only and note why.
  sanitizers:
    name: sanitizers (ASAN+UBSAN)
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Build (Debug + ASAN+UBSAN on our targets only; DZ_SANITIZE gate)
        run: |
          cmake -B build-san -DCMAKE_BUILD_TYPE=Debug -DDZ_SANITIZE=ON
          cmake --build build-san -j
      - name: Unit tests under sanitizers
        run: ./build-san/op_tests
        shell: bash
      - name: CLI exit-code contracts under sanitizers
        run: bash harness/test_cli_errors.sh ./build-san/opd
      - name: Golden renders under sanitizers (bit-exact vs committed fixtures)
        run: bash harness/run_goldens.sh ./build-san/opd

  sidecar:
    name: ai-sidecar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - name: Sync + test
        run: |
          cd ai-sidecar
          uv sync --all-extras 2>/dev/null || uv sync
          uv run pytest -q
          uv run ruff check .
